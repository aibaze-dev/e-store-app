name: Convex backend and site
run-name: 'Ateneo ${{ inputs.requestId || github.sha }}'
# ARCHIVADO: GitHub no ejecuta workflows fuera de .github/workflows/.
# Los despliegues se realizan manualmente desde la máquina local.
# Ver .github/README.md antes de reactivar este archivo.
on:
  # push:
  #   branches: ["main"]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit revisado para publicar
        required: true
      requestId:
        description: Operación del portal
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: convex-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Convex backend
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify current branch before deploying
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
        with:
          script: |
            const head = await github.rest.git.getRef({ ...context.repo, ref: `heads/${context.ref.replace('refs/heads/', '')}` });
            if (head.data.object.sha !== process.env.EXPECTED_SHA) core.setFailed('La rama cambió. Ejecutá el deploy sobre la última versión.');
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - run: pnpm install --no-frozen-lockfile
      - name: Check whether the backend is already validated
        id: backend
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('unchanged', 'false');
            const { execFileSync } = require('node:child_process');
            const git = (...args) => execFileSync('git', args, { maxBuffer: 25 * 1024 * 1024 });
            const message = git('log', '-1', '--format=%B').toString();
            const previous = message.match(/^Ateneo-Backend-Unchanged: ([a-f0-9]{40})$/m)?.[1];
            if (!previous) return;
            try {
              if (git('rev-parse', `${context.sha}^`).toString().trim() !== previous) return;
              const runs = await github.rest.actions.listWorkflowRuns({ ...context.repo,
                workflow_id: 'deploy.yml', head_sha: previous, event: 'push', status: 'success', per_page: 100 });
              if (!runs.data.workflow_runs.some(run => run.head_branch === context.ref.replace('refs/heads/', ''))) return;
              const snapshot = sha => {
                const files = {};
                for (const entry of git('ls-tree', '-rz', sha).toString().split('\0').filter(Boolean)) {
                  const [metadata, name] = entry.split('\t');
                  const [mode, type, blob] = metadata.split(' ');
                  if (type !== 'blob') continue;
                  if (name.split('/').some(part => ['node_modules', '.git', 'dist', '.next', '.vercel'].includes(part) || part.startsWith('.env') || ['.npmrc', '.yarnrc', '.netrc'].includes(part)) || /\.(pem|key|p12|pfx)$/i.test(name)) continue;
                  if (!['100644', '100755'].includes(mode)) throw new Error('Unsupported repository entry');
                  files[name] = git('cat-file', 'blob', blob);
                }
                return files;
              };
              const { backendFingerprint } = require(`${process.cwd()}/.github/scripts/backend-inputs.cjs`);
              const ts = require(`${process.cwd()}/node_modules/typescript`);
              if (backendFingerprint(snapshot(previous), ts) === backendFingerprint(snapshot(context.sha), ts)) {
                core.setOutput('unchanged', 'true');
                core.info('Backend inputs match a successful deployment; skipping Convex deploy.');
              }
            } catch {
              core.info('Could not prove backend equivalence; running the full deployment.');
            }
      - name: Deploy Convex functions and schema
        if: github.event_name == 'push' && steps.backend.outputs.unchanged != 'true'
        run: pnpm exec convex deploy --yes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
  site:
    name: Convex site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - run: pnpm install --no-frozen-lockfile
      - name: Generate Convex bindings for site build
        run: pnpm exec convex codegen
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Verify latest commit before publishing
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ inputs.sha || github.sha }}
        with:
          script: |
            const head = await github.rest.git.getRef({ ...context.repo, ref: `heads/${context.ref.replace('refs/heads/', '')}` });
            if (head.data.object.sha !== process.env.EXPECTED_SHA) core.setFailed('Hay un push más reciente. Su workflow publicará el sitio.');
      - name: Publish Convex site automatically
        run: pnpm exec static-hosting deploy --skip-convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
